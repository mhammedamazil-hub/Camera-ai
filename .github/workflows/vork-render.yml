name: vork render

# Renders shot-01 on a machine with no GPU.
#
# GitHub-hosted runners have no GPU at all, and the hosted GPU runners (T4) have no
# ray-tracing cores, which vork requires for hardware rendering. So this installs
# Mesa's lavapipe software Vulkan driver and renders with vork's supported CPU path
# (`--gpu cpu`). Measured on ubuntu-24.04: 1m24s for 1600x672 std/final; installing
# vork dominates the job.
#
# Have an RTX-class box? Register it as a self-hosted runner labelled
# `self-hosted,gpu` and dispatch with runner: self-hosted-gpu.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Render profile
        type: choice
        options: [std/draft, std/final, std/path]
        default: std/final
      resolution:
        description: Output resolution (WxH)
        default: "1600x672"
      samples:
        description: Override sample budget (blank = profile default)
        default: ""
      runner:
        description: Where to render
        type: choice
        options: [github-cpu, self-hosted-gpu]
        default: github-cpu
      commit_render:
        description: Commit the render back to this branch so it is viewable in the repo
        type: boolean
        default: true
      sweep_exposures:
        description: Instead of one frame, render a settings sweep contact sheet
        type: boolean
        default: false
      sweep_variants:
        description: Space-separated variants, e.g. "e=-0.5,sun=-0.10,aer=0.8,E=1"
        default: 
  push:
    # Only content changes render. Editing this workflow or the setup action must not
    # burn a CPU render, and shot-01/render*.png is excluded so a CI commit cannot
    # re-trigger itself.
    paths:
      - shot-01/scene.json
      - scripts/build_scene.py

permissions:
  contents: write

concurrency:
  group: vork-render-${{ github.ref }}
  cancel-in-progress: false

env:
  PROFILE: ${{ inputs.profile || 'std/final' }}
  RESOLUTION: ${{ inputs.resolution || '1600x672' }}
  SAMPLES: ${{ inputs.samples || '' }}
  RUNNER_KIND: ${{ inputs.runner || 'github-cpu' }}
  SHOT: shot-01
  VORK_CACHE_DIR: ${{ github.workspace }}/.vork-cache

jobs:
  render:
    name: render ${{ inputs.profile || 'std/final' }} (${{ inputs.runner || 'github-cpu' }})
    runs-on: ${{ fromJSON(inputs.runner == 'self-hosted-gpu' && '["self-hosted","gpu"]' || '"ubuntu-24.04"') }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-vork
        with:
          mode: ${{ inputs.runner == 'self-hosted-gpu' && 'hardware' || 'cpu' }}

      # ---- validation (CPU only, no device needed)
      - name: The committed scene must match its generator
        run: |
          python3 scripts/build_scene.py
          if ! git diff --quiet -- shot-01/scene.json; then
            echo "::error::shot-01/scene.json is out of date; run scripts/build_scene.py and commit it"
            git diff --stat -- shot-01/scene.json
            exit 1
          fi
          echo "scene.json is reproducible from scripts/build_scene.py"

      - name: vork check
        run: vork check shot-01/scene.json

      - name: vork export (geometry, no GPU needed)
        run: python3 scripts/export_geometry.py

      # ---- rendering
      - name: Cache vork's compiled shader cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VORK_CACHE_DIR }}
          key: vork-cache-${{ runner.os }}-${{ env.PROFILE }}-${{ hashFiles('shot-01/scene.json') }}
          restore-keys: |
            vork-cache-${{ runner.os }}-${{ env.PROFILE }}-

      - name: Device report
        continue-on-error: true
        run: |
          set -o pipefail
          vork setup --skip-warmup 2>&1 | tee setup.log
          echo "--- vork setup exit: ${PIPESTATUS[0]} ---"

      - name: Settings sweep
        if: inputs.sweep_exposures
        env:
          SWEEP_VARIANTS: ${{ inputs.sweep_variants }}
        run: |
          set -o pipefail
          python3 -m pip install --quiet numpy pillow
          python3 scripts/sweep_exposure.py 2>&1 | tee sweep.log

      - name: Smoke frame (same profile, so the kernel compile is shared)
        if: ${{ !inputs.sweep_exposures }}
        run: |
          set -o pipefail
          GPU_ARG="--gpu cpu"
          if [ "$RUNNER_KIND" = "self-hosted-gpu" ]; then GPU_ARG=""; fi
          start=$(date +%s)
          vork render "$SHOT/scene.json" --out "$SHOT/render_preview.png" \
            --profile "$PROFILE" $GPU_ARG --set resolution=400x168 2>&1 | tee smoke.log
          echo "smoke wall $(( $(date +%s) - start ))s" | tee -a smoke.log

      - name: Render at ${{ env.RESOLUTION }} with ${{ env.PROFILE }}
        if: ${{ !inputs.sweep_exposures }}
        run: |
          set -o pipefail
          GPU_ARG="--gpu cpu"
          if [ "$RUNNER_KIND" = "self-hosted-gpu" ]; then GPU_ARG=""; fi
          SET_SAMPLES=""
          if [ -n "$SAMPLES" ]; then SET_SAMPLES="--set samples=$SAMPLES"; fi
          start=$(date +%s)
          vork render "$SHOT/scene.json" --out "$SHOT/render.png" \
            --profile "$PROFILE" $GPU_ARG --set "resolution=$RESOLUTION" $SET_SAMPLES \
            --diagnostics 2>&1 | tee render.log
          echo "render wall $(( $(date +%s) - start ))s" | tee -a render.log

      # ---- measurement
      - name: Compare against the plate
        if: ${{ !inputs.sweep_exposures }}
        run: |
          set -o pipefail
          python3 -m pip install --quiet numpy pillow
          if [ ! -f shot-01/render.png ]; then
            echo "no render.png produced; skipping comparison" | tee compare.txt
            exit 0
          fi
          {
            python3 scripts/compare.py shot-01/reference.png shot-01/render.png shot-01/compare_ci.png
            echo
            python3 scripts/silhouette.py shot-01/reference.png shot-01/render.png
          } | tee compare.txt

      - name: Publish to the job summary
        if: always()
        run: |
          {
            echo "### vork render vs plate"
            echo ""
            echo "profile \`$PROFILE\`, $RESOLUTION, runner \`$RUNNER_KIND\`"
            echo ""
            echo '```'
            cat compare.txt 2>/dev/null || echo "(no comparison produced)"
            echo '```'
            echo ""
            echo "vork exposure summary / timings:"
            echo '```'
            grep -hE 'wall|Render:|clipped|near-black|mean' render.log smoke.log 2>/dev/null | tail -20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vork-render-${{ github.run_number }}
          path: |
            shot-01/render.png
            shot-01/render_preview.png
            shot-01/compare_ci.png
            shot-01/exposure_sweep.png
            shot-01/*.meta.json
            compare.txt
            render.log
            smoke.log
            setup.log
          if-no-files-found: warn
          retention-days: 30

      - name: Commit the render back to the branch
        if: inputs.commit_render && github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "vork-render[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f shot-01/exposure_sweep.png 2>/dev/null || true
          git add -f shot-01/render.png shot-01/render_preview.png shot-01/compare_ci.png compare.txt 2>/dev/null || true
          git add -f shot-01/*.meta.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "render is byte-identical to the committed one; nothing to commit"
          else
            git commit -m "CI render: $PROFILE $RESOLUTION ($RUNNER_KIND) [skip ci]"
            git push
          fi

      - name: What to do if this failed
        if: failure()
        run: |
          {
            echo "### Render failed"
            echo ""
            echo "Most likely cause: the software Vulkan device (lavapipe) was rejected;"
            echo "vork needs ray queries and storage buffer arrays."
            echo ""
            echo '```'
            tail -30 render.log smoke.log setup.log 2>/dev/null || true
            echo '```'
            echo ""
            echo "Options: register a self-hosted RTX-class runner (labels \`self-hosted,gpu\`),"
            echo "re-dispatch with \`self-hosted-gpu\`, or render on a machine with an"
            echo "RT-capable Vulkan driver."
          } >> "$GITHUB_STEP_SUMMARY"
