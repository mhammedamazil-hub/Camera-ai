<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NACE-1</title><style>
*{box-sizing:border-box}body{font-family:-apple-system,system-ui,sans-serif;max-width:820px;margin:0 auto;padding:16px;
background:#0a0c10;color:#e8e8e8;height:100vh;display:flex;flex-direction:column}
h1{margin:0 0 4px;font-size:20px;font-weight:600}h1 span{color:#4ade80}
.sub{font-size:12px;color:#7a8699;margin-bottom:12px}
#bar{background:#151a22;border:1px solid #1f2733;border-radius:10px;padding:10px 14px;font-size:12px;
color:#9fb4d8;margin-bottom:12px;line-height:1.7}
#bar b{color:#4ade80}
#chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 0;min-height:200px}
.msg{padding:11px 15px;border-radius:14px;max-width:88%;white-space:pre-wrap;line-height:1.5;font-size:14px}
.user{background:#1d4ed8;align-self:flex-end;color:#fff}
.nace{background:#151a22;border:1px solid #1f2733;align-self:flex-start}
.mem{font-size:11px;color:#6b8cba;margin-top:8px;border-top:1px solid #1f2733;padding-top:6px}
.thinking{color:#8b95a5;font-style:italic}
#row{display:flex;gap:8px;margin-top:12px}
input{flex:1;padding:13px;border-radius:11px;border:1px solid #28303d;background:#151a22;color:#fff;font-size:14px}
input:focus{outline:none;border-color:#3b82f6}
button{padding:13px 18px;border-radius:11px;border:none;background:#2563eb;color:#fff;cursor:pointer;font-size:14px;font-weight:500}
button:hover{background:#1d4ed8}button:disabled{opacity:.5;cursor:wait}
button.ghost{background:#1f2733;color:#b9c6d8}button.ghost:hover{background:#28303d}
.sleep{background:#4c1d95}
</style></head><body>
<h1>◈ NACE-1 <span>●</span></h1>
<div class="sub">Fused entity — real TinyLlama-1.1B weights + persistent memory + sleep</div>
<div id="bar">connecting…</div>
<div id="chat"></div>
<div id="row">
<input id="in" placeholder="Talk to NACE-1…  or say 'remember …'" onkeydown="if(event.key==='Enter')speak()">
<button id="sb" onclick="speak()">Send</button>
<button class="ghost sleep" onclick="sleeep()">💤 Sleep</button>
</div>
<script>
const chat=document.getElementById('chat'),bar=document.getElementById('bar');
function add(cls,text,mem){const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;
 if(mem&&mem.length){const s=document.createElement('div');s.className='mem';
 s.textContent='◆ recalled '+mem.length+' memory: '+mem.map(m=>m.content.slice(0,90)).join(' · ');d.appendChild(s)}
 chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
async function api(p,b){const r=await fetch(p,{method:b?'POST':'GET',headers:{'Content-Type':'application/json'},
 body:b?JSON.stringify(b):undefined});if(!r.ok)throw new Error(await r.text());return r.json()}
async function state(){try{const s=await api('/api/state');
 bar.innerHTML=`<b>${s.entity}</b> · model ${s.model} (${s.model_mb}MB) · real weights <b>✓</b> · sleep_count <b>${s.sleep_count}</b> · memories ${JSON.stringify(s.memories)}`;
}catch(e){bar.textContent='state unavailable: '+e.message}}
async function speak(){const i=document.getElementById('in'),t=i.value.trim();if(!t)return;i.value='';add('user',t);
 const b=document.getElementById('sb');b.disabled=true;
 const th=add('nace thinking','NACE-1 is thinking…');
 try{const r=await api('/api/speak',{message:t});th.remove();add('nace',r.reply,r.recalled);state()}
 catch(e){th.remove();add('nace','error: '+e.message)}finally{b.disabled=false;i.focus()}}
async function sleeep(){const th=add('nace thinking','NACE-1 is sleeping… consolidating memory');
 try{const r=await api('/api/sleep',{});th.remove();
 add('nace',`💤 Sleep complete.\n${r.experiences_analyzed} experiences analysed · ${r.new_semantic} semantic formed · ${r.new_episodic} episodic · ${r.duplicates_rejected} duplicates rejected\ncheckpoint: ${r.checkpoint} · resume: ${r.resume_state}`);
 state()}catch(e){th.remove();add('nace','error: '+e.message)}}
state();add('nace','I am NACE-1. I run on real pretrained weights on this machine and I carry my memory across sessions.\n\nTry:\n• remember my favourite colour is teal\n• what is my favourite colour?\n• press 💤 Sleep, then ask again');
</script></body></html>
