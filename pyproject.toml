[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "nace"
version = "0.1.0"
description = "NACE - Neurogenesis Artificial Cognitive Engine: persistent AI with autonomous sleep and memory consolidation"
requires-python = ">=3.10"
license = {text="MIT"}
dependencies = []
[project.optional-dependencies]
dev = ["pytest>=7"]
transformers = ["transformers>=4.40", "torch>=2.0"]
[project.scripts]
nace = "nace.cli.main:main"
[tool.setuptools.packages.find]
include = ["nace*"]
